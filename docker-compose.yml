version: "3.9"

# ── Internal network — services talk to each other by service name ─────────────
networks:
  app-network:
    driver: bridge

# ── Named volumes for persistent data ─────────────────────────────────────────
volumes:
  mongo_data:
  minio_data:
  redis_data:

services:

  # ── MongoDB ──────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: webproject
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (object storage) ───────────────────────────────────────────────────
  minio:
    image: quay.io/minio/minio
    container_name: minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Background Worker (BullMQ email processor) ───────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: worker
    restart: unless-stopped
    command: ["node", "worker.js"]
    env_file:
      - ./backend/.env
    environment:
      MONGO_URI: mongodb://mongodb:27017/webproject
      MINIO_ENDPOINT: http://minio:9000
      REDIS_URL: redis://redis:6379
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  # ── Backend (Express + Socket.io) ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Override values that must point to Docker service names
      MONGO_URI: mongodb://mongodb:27017/webproject
      MINIO_ENDPOINT: http://minio:9000
      REDIS_URL: redis://redis:6379
      CLIENT_URL: https://localhost
      MINIO_PUBLIC_URL: https://localhost/storage/videos
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Frontend (Next.js) ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # At build-time the browser will hit Nginx, which proxies /api → backend
        NEXT_PUBLIC_API_URL: https://localhost
        NEXT_PUBLIC_SOCKET_URL: https://localhost
    container_name: frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://localhost
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

  # ── Nginx (reverse proxy) ────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app-network